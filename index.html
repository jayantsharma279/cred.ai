<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Upload and Parse</title>
</head>
<body>
    <h1>Upload PDF for Parsing</h1>
    <input type="file" id="fileInput">
    <button onclick="uploadFile()">Upload</button>

    <h2>Parsed Output:</h2>
    <textarea id="outputText" rows="10" cols="50"></textarea>

    <script>
        function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const formData = new FormData();
            formData.append("pdf", fileInput.files[0]);

            fetch('https://api.cloud.llamaindex.ai/api/parsing/upload', {
                method: 'POST',
                headers: {
                    'Authorization': 'bearer llx-4NtZLmrLPlJX6ZQZBN4T1Y9B8Bu2YlQPy8UjaxEJN7PzXYOo',
                },
                body: formData,
            })
            .then(response => response.json())  // This line converts the response to JSON
            .then(data => {
                const outputText = document.getElementById("outputText");
                outputText.value = JSON.stringify(data, null, 2);  // Pretty-printing JSON data in the text area
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
